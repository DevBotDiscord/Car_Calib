<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>car-calib Jetson</title>
  <link rel="stylesheet" href="/dashboard/static/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">car-calib</div>
    <div class="pills">
      <span id="pFsm" class="h-pill"><span class="dot"></span><span class="lbl">GAPPING</span></span>
      <span id="pBase" class="h-pill"><span class="dot"></span><span class="lbl">STOP</span></span>
      <span id="pRelay" class="h-pill"><span class="dot"></span><span class="lbl">relay</span></span>
    </div>
  </header>
  <div id="healthBanner" class="health-banner"></div>
  <h1>car-calib · jetson</h1>
  <div class="layout">
    <div class="panel">
      <h2>Live stream</h2>
      <div class="stream-wrap"><img id="stream" class="stream" alt="camera stream" src="/stream"></div>
      <h3>Status</h3>
      <div id="statusBar"></div>
      <div id="metricGrid" style="margin-top:12px"></div>
    </div>
    <div class="panel">
      <h2>Controls</h2>
      <div class="row">
        <button class="btn primary" onclick="cmd('base','FORWARD')">▶ Forward</button>
        <button class="btn danger" onclick="cmd('base','STOP')">■ Stop</button>
        <button class="btn" onclick="cmd('base','BACKWARD')">◀ Backward</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn" onclick="cmd('base','TURN_LEFT')">↰ Left</button>
        <button class="btn" onclick="cmd('base','TURN_RIGHT')">↱ Right</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="btnRelay" onclick="toggleRelay()">💡 Relay OFF</button>
        <button class="btn primary" onclick="cmd('power','ON')">⏻ Bật xe</button>
        <button class="btn danger" onclick="cmd('power','OFF')">⭘ Tắt xe</button>
      </div>
      <div id="eventLog" style="margin-top:12px"></div>
    </div>
  </div>
  <script>
    // ── state ──
    let lastRelay = false;

    function cmd(cat, val) {
      fetch('/api/' + cat + '/' + val).then(r => r.text()).catch(e => console.error(e));
    }
    function toggleRelay() {
      cmd('relay', lastRelay ? 'OFF' : 'ON');
    }

    // ── telemetry poll (5 Hz) ──
    async function poll() {
      try {
        const r = await fetch('/api/status');
        if (!r.ok) return;
        const d = await r.json();

        // header pills
        const fsm = d.fsm || '?';
        const pFsm = document.getElementById('pFsm');
        pFsm.querySelector('.lbl').textContent = fsm;
        pFsm.querySelector('.dot').style.background = d.calib_active ? '#3fb950' : (fsm === 'GAPPING' ? '#f85149' : '#d29922');

        document.getElementById('pBase').querySelector('.lbl').textContent = d.base || 'STOP';
        lastRelay = d.relay_on === true;

        const btnRelay = document.getElementById('btnRelay');
        btnRelay.textContent = lastRelay ? '💡 Relay ON' : '💡 Relay OFF';
        btnRelay.className = 'btn' + (lastRelay ? ' on' : '');

        // status bar
        document.getElementById('statusBar').innerHTML =
          'θ: ' + (d.theta || '--') + '° &nbsp;|&nbsp; servo: ' + d.servo + '° &nbsp;|&nbsp; loop: ' + d.loop_ms + 'ms &nbsp;|&nbsp; frame: ' + d.frame;

        // metric grid
        const theta = d.theta != null ? parseFloat(d.theta) : null;
        document.getElementById('metricGrid').innerHTML = [
          ['FSM', fsm, fsm === 'TRACKING_PD' ? 'text-ok' : (fsm === 'GAPPING' ? 'text-bad' : 'text-warn')],
          ['Theta', theta != null ? theta.toFixed(2) + '°' : '--', ''],
          ['Servo angle', d.servo + '°', ''],
          ['Loop time', d.loop_ms + 'ms', ''],
          ['Base', d.base || 'STOP', ''],
          ['Relay', lastRelay ? 'ON' : 'OFF', lastRelay ? 'text-ok' : ''],
          ['Power', d.power_pulsing ? 'pulsing' : 'idle', d.power_pulsing ? 'text-warn' : ''],
          ['Frame #', d.frame, ''],
          ['Calib active', d.calib_active ? 'YES' : 'NO', d.calib_active ? 'text-ok' : ''],
          ['Theta source', d.theta_src || '?', ''],
        ].map(function(row) {
          return '<div class="metric"><div class="label">' + row[0] + '</div><div class="value ' + (row[2] || '') + '">' + row[1] + '</div></div>';
        }).join('');

      } catch(e) { console.error(e); }
    }
    setInterval(poll, 200);
    poll();
  </script>
</body>
</html>
